name: moneybag
description: "MoneyBag (মানিব্যাগ) — Track your money. Understand your spending. Build your savings. Local-first personal finance & expense tracker for Bangladesh. BDT (৳)."
publish_to: "none"
version: 2.2.5+2205

environment:
  sdk: ^3.5.3

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Local database (SQLite via Drift) — local-first core
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # Preferences & i18n
  shared_preferences: ^2.3.2
  intl: ^0.19.0

  # Encrypted local backup (AES-GCM + PBKDF2)
  cryptography: ^2.7.0

  # Export / backup sharing + restore file picking
  share_plus: ^7.2.2
  file_picker: ^8.1.2

  # Profile photo — camera / gallery picker
  image_picker: ^1.1.2

  # Google Drive backup (OAuth sign-in + Drive v3 REST)
  google_sign_in: ^6.2.1
  http: ^1.2.2

  # Ads (AdMob) — SDK ships with the app; on/off + unit ids come from
  # the Admin API at runtime (see lib/services/remote_config_service.dart)
  google_mobile_ads: ^5.2.0

  # Real notifications — budget alerts, daily & weekly reminders
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^3.0.1

  # Firebase Cloud Messaging — real-time push from the admin panel.
  # Requires google-services.json (Android) / GoogleService-Info.plist (iOS)
  # from your Firebase project — see DEPLOY.md. The app stays fully usable
  # when Firebase is not configured yet (push just stays off).
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.0

  # v2.1 — Smart features:
  # Receipt OCR (on-device ML Kit — free, offline, no data leaves the phone)
  google_mlkit_text_recognition: 0.11.0
  # Fingerprint / device-PIN app lock
  local_auth: ^2.3.0
  # Home screen widget (Android)
  home_widget: ^0.7.0
  # Material You dynamic color (Android 12+ wallpaper theme)
  dynamic_color: 1.7.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Drift code generation
  drift_dev: ^2.20.0
  build_runner: ^2.4.12

flutter:
  uses-material-design: true

  assets:
    - assets/fonts/
    - assets/images/

  fonts:
    - family: NotoSansBengali
      fonts:
        - asset: assets/fonts/NotoSansBengali-Regular.ttf
          weight: 400
        - asset: assets/fonts/NotoSansBengali-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSansBengali-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSansBengali-Bold.ttf
          weight: 700
